# Checks only: tests and a production build. Deploys run from GitHub Actions (.github/workflows/cd.yml).
# The old jobs started the development servers (python main.py, npm run dev), which never finish
# and would run Flask's development server on a CI machine.
stages:
  - test

backend-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r Backend/requirements.txt
  script:
    - |
      for t in Backend/tests/test_*.py; do
        case "$t" in *file_to_gcode*|*end_to_end*) continue;; esac   # need the separate file-to-gcode tool
        python -I -X utf8 "$t"
      done

frontend-build:
  stage: test
  image: node:22-alpine
  script:
    - cd Frontend
    - npm ci
    - npm audit --omit=dev --audit-level=moderate
    - npm run build
