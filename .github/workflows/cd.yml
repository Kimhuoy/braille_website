name: Deploy main

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: 2026.09.28-10

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        # GitHub Container Registry requires lowercase image names
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/docker-swarm/deployments/braille

            # Log in to GitHub Container Registry on your server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest images built by this workflow
            docker pull ${{ env.REGISTRY }}/${{ env.REPO }}-web:${{ env.IMAGE_TAG }}
            
            # --- DEPLOYMENT
            
            # Execute deployment
            echo "Executing deployment script..."
            set -x  # Enable debug output
            ./deploy.sh ${{ env.REGISTRY }}/${{ env.REPO }}-web:${{ env.IMAGE_TAG }} 2>&1 || { echo "❌ Deployment script failed"; exit 1; }
            set +x  # Disable debug output
            
            echo "✓ Deployment script completed"

            # Check docker stack status
            echo "Checking Docker stack status..."
            docker stack ps braille --no-trunc
            
            echo "✅ Deployment successful!"
